<div class="min-h-screen bg-background flex flex-col justify-center items-center px-4">
  <div class="max-w-md w-full bg-white rounded-3xl shadow-xl overflow-hidden p-8 border border-lines/50">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-serif font-bold text-primary">Admin Login</h2>
      <p class="text-gray-500 mt-2">Log in om menu en openingstijden te beheren</p>
    </div>
    
    <div class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">E-mailadres</label>
        <input type="email" id="email" [(ngModel)]="email" class="w-full px-4 py-3 rounded-lg border border-lines focus:outline-none focus:ring-2 focus:ring-primary/50" placeholder="admin@denhoftakeaway.com">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Wachtwoord</label>
        <input type="password" id="password" [(ngModel)]="password" (keyup.enter)="login()" class="w-full px-4 py-3 rounded-lg border border-lines focus:outline-none focus:ring-2 focus:ring-primary/50" placeholder="••••••••">
      </div>
      
      @if (error) {
        <p class="text-red-500 text-sm text-center">{{ error }}</p>
      }

      <button (click)="login()" [disabled]="loading" class="w-full bg-primary text-white py-3 mt-2 rounded-lg font-bold hover:bg-opacity-90 transition-colors shadow-md disabled:opacity-50">
        {{ loading ? 'Bezig met inloggen...' : 'Inloggen' }}
      </button>
      
      <div class="text-center mt-4">
        <a routerLink="/" class="text-sm text-gray-500 hover:text-primary transition-colors">&larr; Terug naar website</a>
      </div>
    </div>
  </div>
</div>
