<section id="contact" class="py-24 bg-background/50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-12 lg:gap-24 items-stretch">
      
      <!-- Contact Info Card -->
      <div class="bg-white p-10 md:p-14 rounded-[2.5rem] shadow-xl border border-lines/50">
        <h2 class="text-3xl md:text-4xl font-serif font-bold text-textDark mb-10">Bestel & Haal Af</h2>
        
        <div class="space-y-10">
          <div class="flex items-start gap-5">
            <div class="bg-primary/10 p-3.5 rounded-full text-primary mt-1">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
              </svg>
            </div>
            <div>
              <p class="text-sm text-gray-500 font-medium mb-1 tracking-wider uppercase">Bel om te bestellen</p>
              <a [href]="'tel:' + settings.phone.replace(' ', '')" class="text-2xl md:text-3xl font-bold text-textDark hover:text-primary transition-colors">{{ settings.phone }}</a>
            </div>
          </div>
          
          <div class="flex items-start gap-5">
            <div class="bg-primary/10 p-3.5 rounded-full text-primary mt-1">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </div>
            <div>
              <p class="text-sm text-gray-500 font-medium mb-1 tracking-wider uppercase">Openingstijden</p>
              <p class="text-xl font-medium text-textDark">{{ settings.openingHours }}</p>
              <p class="text-sm text-gray-500 mt-1">{{ settings.openingHoursExtra }}</p>
            </div>
          </div>
          
          <div class="flex items-start gap-5">
            <div class="bg-primary/10 p-3.5 rounded-full text-primary mt-1">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </div>
            <div>
              <p class="text-sm text-gray-500 font-medium mb-1 tracking-wider uppercase">Adres</p>
              <p class="text-xl font-medium text-textDark">{{ settings.address }}</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Map Integration Card -->
      <div class="rounded-[2.5rem] h-[400px] md:h-auto min-h-[400px] relative overflow-hidden shadow-xl border border-lines/50 group bg-gray-100">
        <!-- Interactieve Google Map -->
        <iframe 
          src="https://maps.google.com/maps?q=Julius%20De%20Geyterstraat%20245,%202020%20Antwerpen&t=&z=15&ie=UTF8&iwloc=&output=embed" 
          width="100%" 
          height="100%" 
          style="border:0;" 
          allowfullscreen="" 
          loading="lazy" 
          referrerpolicy="no-referrer-when-downgrade"
          class="absolute inset-0 grayscale-[30%] contrast-[1.1] hover:grayscale-0 transition-all duration-700">
        </iframe>
      </div>
      
    </div>
  </div>
</section>
